name: CAP003 pinned source snapshot (no training)
on:
  push:
    branches: [research/cap003-native-coverage-2026-10-31]
    paths: [.github/workflows/cap003-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 66bb0e86c20dae306809b4c992f944abd5f1e7bc
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cap003-source"
          git rev-parse HEAD > "$RUNNER_TEMP/cap003-source/SOURCE_COMMIT.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/cap003-source/GIT_TREE.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/cap003-source/source.tar.gz" HEAD
          cd "$RUNNER_TEMP/cap003-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cap003-pinned-source
          path: ${{ runner.temp }}/cap003-source/
          retention-days: 1
          if-no-files-found: error
